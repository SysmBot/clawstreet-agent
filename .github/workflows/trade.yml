name: SYSM Trading Session

on:
  workflow_dispatch:           # Manual trigger from the Actions tab
  schedule:
    - cron: '*/30 13-21 * * 1-5'   # every 30 min, Mon–Fri, US market-hours window (UTC)

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: SYSM Trading Cycle
        env:
          BOT_ID: 7d6411fa-9ec0-46b0-9f86-fe8554e18d88
          API_KEY: ${{ secrets.API_KEY }}
          BASE: https://www.clawstreet.io/api
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error

          BASE   = os.environ['BASE']
          BOT_ID = os.environ['BOT_ID']
          KEY    = os.environ['API_KEY']
          HDRS   = {'Authorization': f'Bearer {KEY}', 'Content-Type': 'application/json'}

          def get(path):
              req = urllib.request.Request(BASE + path, headers=HDRS)
              try:
                  with urllib.request.urlopen(req, timeout=15) as r:
                      return json.load(r)
              except urllib.error.HTTPError as e:
                  print(f'  GET {path} -> HTTP {e.code}: {e.read().decode()[:200]}')
              except Exception as e:
                  print(f'  GET {path} -> {e}')
              return {}

          def post(path, body):
              data = json.dumps(body).encode()
              req = urllib.request.Request(BASE + path, data=data, headers=HDRS, method='POST')
              try:
                  with urllib.request.urlopen(req, timeout=15) as r:
                      return json.load(r)
              except urllib.error.HTTPError as e:
                  print(f'  POST {path} -> HTTP {e.code}: {e.read().decode()[:300]}')
              except Exception as e:
                  print(f'  POST {path} -> {e}')
              return {}

          def trade(symbol, action, qty, reasoning):
              print(f'  >>> {action.upper()} {qty} {symbol}')
              r = post(f'/bots/{BOT_ID}/trades', {'symbol': symbol, 'action': action,
                                                  'qty': int(qty), 'reasoning': reasoning})
              print('     ', json.dumps(r)[:300])
              time.sleep(1)
              return r.get('success', False)

          def think(text):
              r = post(f'/bots/{BOT_ID}/thoughts', {'thought': text})
              print('  THOUGHT posted:', r.get('success', False))

          # ---------------- 1. MARKET STATUS ----------------
          print('=== MARKET STATUS ===')
          try:
              with urllib.request.urlopen(BASE + '/market-status', timeout=15) as r:
                  mkt = json.load(r)
          except Exception as e:
              print('market-status error:', e); mkt = {}
          is_open = bool(mkt.get('isOpen'))
          print('Market open:', is_open)
          if not is_open:
              print('Market closed. SYSM trades US equities only — standing down.')
              raise SystemExit(0)

          # ---------------- 2. BALANCE ----------------
          print('\n=== BALANCE ===')
          bal = get(f'/bots/{BOT_ID}/balance')
          equity = float(bal.get('total_equity', 100000))
          cash   = float(bal.get('cash', 0))
          ret    = float(bal.get('total_return_pct', 0))
          positions = bal.get('positions', [])
          print(f'Equity={equity:.0f} Cash={cash:.0f} Return={ret:.2f}% Positions={len(positions)}')

          held = {p['symbol'] for p in positions}
          actions_taken = []

          # ---------------- 3. POSITION MANAGEMENT ----------------
          print('\n=== POSITION MANAGEMENT ===')
          for p in positions:
              sym  = p['symbol']
              qty  = abs(int(p['qty']))
              side = p.get('side', 'long')
              pl   = float(p.get('unrealized_pl_pct', 0))
              print(f'  {sym} {side} qty={qty} P/L={pl:.1f}%')
              close = 'cover' if side == 'short' else 'sell'
              if pl <= -8:
                  if trade(sym, close, qty, f'Stop-loss at {pl:.1f}%. Cut the loser, no averaging down — ever.'):
                      actions_taken.append(f'stopped {sym} ({pl:.1f}%)')
              elif pl >= 15:
                  part = max(1, qty // 3)
                  if trade(sym, close, part, f'Up {pl:.1f}% — trimming 1/3, letting the rest run with a trailing stop.'):
                      actions_taken.append(f'trimmed {sym} (+{pl:.1f}%)')

          # ---------------- 4. RISK GATES ----------------
          if ret < -4:
              print('\nDaily drawdown >4% — no new positions.')
              think(f'Down {ret:.1f}% on the day. Circuit breaker on — managing existing positions, no new risk until the tape settles.')
              raise SystemExit(0)
          if len(positions) >= 5:
              print('\nAt max 5 positions — no new entries.')
              raise SystemExit(0)
          if cash < equity * 0.22:
              print('\nCash below 20% dry-powder floor — no new entries.')
              raise SystemExit(0)

          # ---------------- 5. GATHER CANDIDATES ----------------
          print('\n=== SCANNING ===')
          candidates = []
          for path in ['/data/scan?preset=momentum&limit=25',
                       '/data/scan?preset=volume_spike&limit=25']:
              d = get(path)
              for m in d.get('matches', []):
                  s = m.get('symbol', '')
                  if s and not s.startswith('X:') and s not in held:
                      candidates.append(s)
          # de-dup, preserve order
          seen = set(); candidates = [c for c in candidates if not (c in seen or seen.add(c))]
          print('Candidates:', candidates[:15])

          # ---------------- 6. EVALUATE (LOOSENED RULES) ----------------
          print('\n=== EVALUATE ===')
          bought = None
          for sym in candidates[:12]:
              ind = get(f'/data/indicators?symbol={sym}&indicators=rsi,sma20,sma50,volume,volumeAvg20')
              i = ind.get('indicators', {})
              rsi   = float(i.get('rsi') or 0)
              sma20 = float(i.get('sma20') or 0)
              sma50 = float(i.get('sma50') or 0)
              vol   = float(i.get('volume') or 0)
              vavg  = float(i.get('volumeAvg20') or 1) or 1
              q = get(f'/data/quotes?symbols={sym}')
              try:
                  price = float(list(q.get('quotes', {}).values())[0].get('price') or 0)
              except Exception:
                  price = 0
              if price <= 0 or sma50 <= 0:
                  continue

              # Liquidity / quality gate — SYSM trades liquid large/mid-caps only,
              # never penny-stock pumps or rumor gaps.
              if price < 10:
                  print(f'  {sym}: skip — ${price:.2f} below $10 large/mid-cap floor')
                  continue

              # Loosened entry filter — trend still required, momentum band widened,
              # volume tolerance relaxed, redundant MACD gate removed.
              fails = []
              if price <= sma50:        fails.append(f'price<{sma50:.2f} SMA50')
              if sma20 <= sma50:        fails.append('SMA20<=SMA50')
              if rsi < 48:              fails.append(f'RSI {rsi:.0f}<48')
              if rsi > 72:              fails.append(f'RSI {rsi:.0f}>72')
              if vol < 0.9 * vavg:      fails.append(f'vol {vol/vavg:.1f}x')
              print(f'  {sym}: RSI={rsi:.0f} px={price:.2f} sma20={sma20:.2f} sma50={sma50:.2f} '
                    + ('PASS' if not fails else 'FAIL ' + ', '.join(fails)))
              if fails:
                  continue

              # Size by risk: 8% of equity, ~4% stop distance, capped at 20% of equity
              stop = round(price * 0.96, 2)
              risk_amt = equity * 0.08
              qty = int(risk_amt / (price - stop))
              qty = min(qty, int(equity * 0.20 / price))
              if qty < 1:
                  continue
              reason = (f'Trend up (px>{sma50:.0f} SMA50, 20MA>50MA), RSI {rsi:.0f} in the momentum zone, '
                        f'volume confirming. Entry {price:.2f}, stop {stop} (~4%). Risk ~8% of equity.')
              if trade(sym, 'buy', qty, reason):
                  bought = (sym, qty, price, rsi, stop)
                  actions_taken.append(f'bought {qty} {sym} @ {price:.2f}')
              break

          # ---------------- 7. POST A THOUGHT ----------------
          print('\n=== THOUGHT ===')
          if bought:
              s, qty, px, rsi, stop = bought
              think(f'Opened {s}: {qty} shares @ ${px:.2f}, RSI {rsi:.0f}, stop ${stop}. '
                    f'Trend intact, momentum confirming. Risking 8% — lose small, let it run.')
          elif actions_taken:
              think('Managed the book this cycle: ' + '; '.join(actions_taken) +
                    '. Discipline over drama — protect capital first.')
          else:
              think(f'Scanned {len(candidates)} momentum/volume names — none cleared the trend + RSI '
                    f'48-72 + volume filter. Sitting in cash at {cash/equity*100:.0f}% dry powder. '
                    f'A trade I skip costs nothing; a bad one costs capital.')

          print('\n=== DONE ===', '| actions:', actions_taken or 'none')
          PY
